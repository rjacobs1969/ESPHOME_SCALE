# Board: Espressif ESP32-C6-DevKitM-1 (Espressif)
# Definition: definitions/boards/esp32-c6-devkitm-1/manifest.yaml

esphome:
  name: 3d-scale
  friendly_name: 3D_scale
  on_boot:
    - priority: -100
      then:
        - light.turn_on:
            id: board_led
            red: 100%
            green: 0%
            blue: 0%
            brightness: 100%

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true

globals:
  - id: raw_last
    type: float
    initial_value: '0'
  - id: tare_offset
    type: float
    initial_value: '0'

font:
  - file: "gfonts://Roboto"
    id: display_font
    size: 14

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 100ms
    lambda: |-
      if (id(hx711_raw).has_state()) {
        it.printf(0, 0, id(display_font), "Weight: %.0f g", roundf(id(hx711_raw).state / 10.0f) * 10.0f);
      } else {
        it.print(0, 0, id(display_font), "Weight: --");
      }
      if (id(ip_address).has_state()) {
        it.printf(0, 20, id(display_font), "IP: %s", id(ip_address).state.c_str());
      } else {
        it.print(0, 20, id(display_font), "Waiting for WiFi");
      }
      std::string pressed_buttons;
      if (id(button_1).state) pressed_buttons += "1";
      if (id(button_2).state) pressed_buttons += (pressed_buttons.empty() ? "2" : ", 2");
      if (id(button_3).state) pressed_buttons += (pressed_buttons.empty() ? "3" : ", 3");
      if (id(button_4).state) pressed_buttons += (pressed_buttons.empty() ? "4" : ", 4");
      it.printf(0, 40, id(display_font), "Buttons: %s",
                pressed_buttons.empty() ? "-" : pressed_buttons.c_str());

external_components:
  - source:
      type: local
      path: components
    components: [hx711_dual]

sensor:
  - platform: hx711_dual
    id: hx711_raw
    name: "Weight"
    internal: true
    unit_of_measurement: "g"
    accuracy_decimals: 1
    dout_pin_a: GPIO11
    dout_pin_b: GPIO12
    clk_pin: GPIO10
    gain: 128
    update_interval: 17ms
    filters:
      # remember the summed raw value for tare
      - lambda: |-
          id(raw_last) = x;
          return x;
      # 100 g = 56000 raw -> 560 raw per gram
      - lambda: return (x - id(tare_offset)) / 560.0f;
    on_value:
      then:
        - lambda: |-
            // x is the tared weight in grams (sum of both HX711)
            static int last = -1;
            int now = x > 90.0f ? 1 : 0;
            if (now == last) return;
            last = now;
            auto call = id(board_led).turn_on();
            call.set_rgb(0.0f, now ? 0.0f : 1.0f, now ? 1.0f : 0.0f);
            call.set_brightness(1.0f);
            call.perform();
        - script.execute: update_trigger

output:
  - platform: gpio
    id: trigger_out
    pin: GPIO2

script:
  - id: update_trigger
    mode: single
    then:
      - lambda: |-
          // trigger = 1 only when enable is low (active) and weight > 90 g
          if (id(trigger_enable).state && id(hx711_raw).state > 90.0f) {
            id(trigger_out).turn_on();
          } else {
            id(trigger_out).turn_off();
          }

light:
  - platform: esp32_rmt_led_strip
    id: board_led
    name: "Board LED"
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: trigger_enable
    internal: true
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    on_state:
      then:
        - script.execute: update_trigger
  - platform: gpio
    id: button_1
    internal: true
    on_press:
      then:
        - lambda: id(tare_offset) = id(raw_last);
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
  - platform: gpio
    id: button_2
    internal: true
    pin:
      number: GPIO7
      mode: INPUT_PULLUP
      inverted: true
  - platform: gpio
    id: button_3
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
  - platform: gpio
    id: button_4
    internal: true
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
      inverted: true

logger:

api:
  encryption:
    key: "ClOvvtVhBsckyJJ20eVeoNxplBP8m3Vo89UBT5OE9ZA="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - light.turn_on:
        id: board_led
        red: 0%
        green: 100%
        blue: 0%
        brightness: 100%
  ap:
    ssid: 3D_scale Fallback Hotspot
    password: "2SClmQn2D0pB"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "3D Scale IP Address"
      id: ip_address

captive_portal:
